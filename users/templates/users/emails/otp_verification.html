<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verifica tu cuenta SoundMe</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #e7eaee; font-family: Arial, sans-serif; color: #002d62;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="padding: 32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 560px; background-color: #ffffff; border-radius: 8px; overflow: hidden;">
            <tr>
              <td align="center" style="background-color: #002d62; padding: 28px 32px 20px;">
                <img src="cid:soundme-logo" width="180" alt="SoundMe" style="display: block; max-width: 180px; height: auto;">
              </td>
            </tr>
            <tr>
              <td style="padding: 36px 32px 28px;">
                <h1 style="margin: 0 0 16px; font-size: 24px; line-height: 30px; color: #002d62;">Verifica tu cuenta</h1>
                <p style="margin: 0 0 24px; font-size: 16px; line-height: 24px; color: #404040;">Usa el siguiente código para completar la verificación de tu cuenta en SoundMe.</p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin: 0 0 24px;">
                  <tr>
                    <td align="center" style="background-color: #e7eaee; border: 2px solid #4fa3d1; border-radius: 8px; padding: 18px; color: #ce1126; font-size: 32px; font-weight: 700; letter-spacing: 8px;">{{ otp_code }}</td>
                  </tr>
                </table>
                <p style="margin: 0; font-size: 14px; line-height: 21px; color: #747474;">Este código vence en 10 minutos. Si no solicitaste esta verificación, puedes ignorar este correo.</p>
              </td>
            </tr>
            <tr>
              <td style="background-color: #002d62; padding: 16px 32px; text-align: center; color: #ffffff; font-size: 12px; line-height: 18px;">SoundMe - Traductor de Voz a Lengua de Señas Dominicana</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
